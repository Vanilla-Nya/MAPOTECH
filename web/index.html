<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MAPOTECH - Medical Application Platform for Operational Technology and Connected Healthcare">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MAPOTECH">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MAPOTECH</title>
  <link rel="manifest" href="manifest.json">

  <!-- Required by supabase_flutter passkeys dependency -->
  <script src="bundle.js"></script>
  <!-- jsQR for client-side camera QR scanning -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <!-- VitaScale zero-install browser Computer Vision module -->
  <script src="vitascale/vitascale_cv.js" defer></script>

  <script>
    // Global helper for decoding QR code directly from Video Element
    window.decodeQrFromVideo = async function(videoEl) {
      if (!videoEl || videoEl.videoWidth === 0 || videoEl.videoHeight === 0) return null;
      
      // 1. Try Native BarcodeDetector if available
      if ('BarcodeDetector' in window) {
        try {
          if (!window._barcodeDetectorInstance) {
            window._barcodeDetectorInstance = new BarcodeDetector({ formats: ['qr_code'] });
          }
          const barcodes = await window._barcodeDetectorInstance.detect(videoEl);
          if (barcodes && barcodes.length > 0 && barcodes[0].rawValue) {
            const val = barcodes[0].rawValue.trim();
            if (val.length > 0) return val;
          }
        } catch (e) {
          // fallback to jsQR
        }
      }
      
      // 2. Try jsQR with downscaled canvas for max 60fps performance
      if (typeof window.jsQR === 'function') {
        try {
          if (!window._qrScanCanvas) {
            window._qrScanCanvas = document.createElement('canvas');
            window._qrScanContext = window._qrScanCanvas.getContext('2d', { willReadFrequently: true });
          }
          
          let w = videoEl.videoWidth;
          let h = videoEl.videoHeight;
          const maxDim = 640;
          if (w > maxDim || h > maxDim) {
            const scale = Math.min(maxDim / w, maxDim / h);
            w = Math.floor(w * scale);
            h = Math.floor(h * scale);
          }
          
          if (window._qrScanCanvas.width !== w || window._qrScanCanvas.height !== h) {
            window._qrScanCanvas.width = w;
            window._qrScanCanvas.height = h;
          }
          
          window._qrScanContext.drawImage(videoEl, 0, 0, w, h);
          const imgData = window._qrScanContext.getImageData(0, 0, w, h);
          const code = window.jsQR(imgData.data, w, h, { inversionAttempts: 'dontInvert' });
          if (code && code.data && code.data.trim()) {
            return code.data.trim();
          }
        } catch (e) {}
      }
      return null;
    };

    // Helper for decoding QR code from an Image File
    window.decodeQrFromImageFile = function(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = async function() {
            try {
              if ('BarcodeDetector' in window) {
                try {
                  if (!window._barcodeDetectorInstance) {
                    window._barcodeDetectorInstance = new BarcodeDetector({ formats: ['qr_code'] });
                  }
                  const barcodes = await window._barcodeDetectorInstance.detect(img);
                  if (barcodes && barcodes.length > 0 && barcodes[0].rawValue) {
                    resolve(barcodes[0].rawValue.trim());
                    return;
                  }
                } catch (_) {}
              }
              
              const canvas = document.createElement('canvas');
              canvas.width = img.width;
              canvas.height = img.height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0);
              const imgData = ctx.getImageData(0, 0, img.width, img.height);
              if (typeof window.jsQR === 'function') {
                const code = window.jsQR(imgData.data, img.width, img.height, { inversionAttempts: 'attemptBoth' });
                if (code && code.data) {
                  resolve(code.data.trim());
                  return;
                }
              }
              resolve(null);
            } catch (err) {
              reject(err);
            }
          };
          img.onerror = () => reject('Gagal memuat gambar');
          img.src = e.target.result;
        };
        reader.onerror = () => reject('Gagal membaca file');
        reader.readAsDataURL(file);
      });
    };
  </script>

  <style>
    body {
      margin: 0;
      background: #FAFAFA;
    }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
