<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MAPOTECH - Medical Application Platform for Operation Technology and Connected Health Care">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MAPOTECH">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MAPOTECH</title>
  <link rel="manifest" href="manifest.json">

  <!-- Required by supabase_flutter passkeys dependency -->
  <script src="bundle.js"></script>

  <style>
    body { margin: 0; background: #0d1117; }
    #preloader {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0d1117;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #preloader .logo {
      width: 56px; height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #48C9B0, #1B4F42);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
      animation: pulse 1.8s ease-in-out infinite;
    }
    #preloader .logo svg { width: 28px; height: 28px; fill: white; }
    #preloader .name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 22px; font-weight: 900; letter-spacing: -0.5px;
      background: linear-gradient(90deg, #1B4F42, #48C9B0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    #preloader .spinner {
      margin-top: 32px;
      width: 28px; height: 28px;
      border: 3px solid rgba(72,201,176,0.15);
      border-top-color: #48C9B0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(72,201,176,0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(72,201,176,0); }
    }
  </style>
</head>
<body>
  <div id="preloader">
    <div class="logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H7l5-8v4h4l-5 8z"/>
      </svg>
    </div>
    <div class="name">MAPOTECH</div>
    <div class="spinner"></div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Hide preloader once Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      var pre = document.getElementById('preloader');
      if (pre) { pre.style.opacity = '0'; setTimeout(function(){ pre.remove(); }, 400); }
    });
  </script>
</body>
</html>
